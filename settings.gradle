pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// Senza questo, l'artifactId su Maven diventa il nome della CARTELLA
// ("PitchBlack"): la coordinate per V112 deve essere net.saturnx:pitchblackdarkness.
rootProject.name = 'pitchblackdarkness'

// Tre livelli, dal generale al particolare:
//   core          Java puro: curva dei livelli, API, interfaccia piattaforma.
//                 ZERO import net.minecraft -> sopravvive ai cambi di versione.
//   mc<ver>/common   sa di quella versione di Minecraft, non del loader (mixin).
//   mc<ver>/<loader> sa del loader (config, tick, comando, schermata).
// Dalla 26.1 la lightmap è passata sulla GPU e mezzo nostro codice-gioco non
// compila più: per questo l'asse VERSIONE è una gerarchia di moduli e non
// commenti-preprocessore. Aggiungere la 26.2 = aggiungere mc262/*, senza
// toccare né core né mc1211.
include 'core'
include 'mc1211:common'
include 'mc1211:neoforge'
include 'mc1211:fabric'

// 26.2: per ora solo il modulo vanilla (gli hook). I moduli di loader
// arriveranno quando NeoForge 26.2 uscira' di beta.
include 'mc262:common'
include 'mc262:neoforge'
// include 'mc262:fabric'   <-- DISATTIVATO di proposito, non e' incompleto:
// il modulo e' scritto, ma la toolchain Fabric per 26.2 non e' ancora usabile.
// Da 26.1 Minecraft e' deobfuscato e Fabric ha smesso di mantenere
// Yarn/Intermediary, quindi non esistono piu' i mapping che fabric-loom
// pretende; ma anche fabric-loom-remap (1.17.16 e 1.18.0-alpha.9) fallisce con
// "Configuration 'mappings' has no dependencies". Riattivare quando la
// toolchain si stabilizza (o quando un template Fabric 26.x mostra la sintassi
// giusta): il resto del modulo e' pronto.
