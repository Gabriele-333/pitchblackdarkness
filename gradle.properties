# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NB: configuration-cache OFF. Fabric Loom 1.21.x non lo supporta ancora in modo
# affidabile in un build multi-progetto; riattivare solo dopo averlo verificato.
org.gradle.configuration-cache=false

## Environment Properties
# Versioni PINNATE identiche a Version112: le due mod devono convivere nello stesso client.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.232
neo_version_range=[21,)
loader_version_range=[4,)
# Vanilla puro per il modulo common (Mojang mappings, nessun loader).
neoform_version=1.21.1-20240808.144430
# Minecraft 26.2 (richiede Java 25)
neoform_version_262=26.2-2
neo_version_262=26.2.0.25-beta
neo_version_range_262=[26,)

## Fabric
fabric_loader_version=0.19.3
# Fabric per 26.2
fabric_api_version_262=0.155.2+26.2
fabric_minecraft_version_range_262=>=26.2 <27
fabric_api_version=0.116.14+1.21.1
fabric_loader_version_range=>=0.16
# ModMenu: dipendenza OBBLIGATORIA su Fabric (depends + modImplementation):
# e' l'unico modo di aprire la schermata di config, che NeoForge ha built-in.
modmenu_version=11.0.4
# Fabric NON usa i range Maven: ha una sintassi semver sua.
fabric_minecraft_version_range=>=1.21.1 <1.22

## Mod Properties
mod_id=pitchblackdarkness
mod_name=PBD - Pitch Black Darkness
mod_license=MIT
mod_version=0.1.0
mod_group_id=net.saturnx
mod_authors=SaturnX Studios (STXS)
mod_description=True darkness, on your terms. Pick a level from 0 (vanilla) to 5 (pitch black): unlit caves go truly dark and moonless nights turn black, while daylight and torches stay exactly vanilla. Beats the Brightness slider. Client-side only.
