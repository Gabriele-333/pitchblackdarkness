plugins {
    // Applicati nei sottoprogetti: common e neoforge usano ModDevGradle
    // (NeoForm per il vanilla puro, NeoForge per il loader), fabric usa Loom.
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'fabric-loom' version '1.17.16' apply false
    // Da MC 26.1 il gioco e' deobfuscato: fabric-loom "legacy" resta solo per le
    // versioni offuscate, per le nuove serve fabric-loom-remap.
    id 'net.fabricmc.fabric-loom-remap' version '1.18.0-alpha.9' apply false
}

// Configurazione comune a tutti i moduli. La versione del PROGETTO resta pulita
// (0.1.0): è la coordinata Maven con cui V112 prende la dipendenza. La versione
// MC e il loader finiscono solo nel NOME del jar distribuito.
// subprojects, non allprojects: il progetto root è solo un contenitore, non ha
// sorgenti, e applicargli java-library gli farebbe produrre un jar vuoto in
// build/libs accanto a quelli veri.
subprojects {
    apply plugin: 'java-library'

    group = mod_group_id
    version = mod_version

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // annotazioni Mixin per common
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Il jar distribuito di ogni loader viene nominato e depositato nel rispettivo
// build.gradle:  build/libs/<loader>/PitchBlackDarkness-<Loader>-<mc>-<mod>.jar
// (cartelle separate nella build ROOT, pronti da caricare senza pescarli dentro
// i sottoprogetti).
