plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

// La versione del PROGETTO resta pulita (0.1.0): è la coordinata Maven con cui
// V112 prende la dipendenza (net.saturnx:pitchblackdarkness:0.1.0). Il nome del
// jar distribuito porta invece anche la versione MC — vedi archiveVersion sotto:
// filename e coordinata sono cose diverse e vanno tenute separate.
version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = 'PitchBlackDarkness'
}

// Jar distribuito: PitchBlackDarkness-<mc>-<mod>.jar (convenzione mod, e quando
// arriveranno più versioni MC i file resteranno distinguibili). Tocca SOLO il
// nome del file: la coordinata Maven sopra non si muove.
tasks.named('jar') {
    archiveVersion = "${minecraft_version}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        // Serve solo a verificare il requisito "no-op pulito su server dedicato":
        // la mod è client-only e qui non deve fare NIENTE.
        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // MixinExtras: NeoForge 21.1.232 lo include a runtime (jarjar, 0.5.3) —
    // serve solo in compile per @WrapOperation (Hook 3). Versione allineata
    // a quella bundled: NON alzarla senza controllare il jarjar di NeoForge.
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'

    // Unit test (solo logica pura, niente classi Minecraft nei test)
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Espande le proprietà nel template neoforge.mods.toml (${} Groovy notation).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Publishing su repo locale: è la strada con cui V112 prenderà la dipendenza
// compileOnly per l'integrazione (dopo, non ora).
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
