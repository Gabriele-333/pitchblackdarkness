plugins {
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

// Vanilla PURO, mapping Mojang, nessun loader. Qui vive il grosso della mod: i
// tre mixin e tutta la matematica di PbdState, che sono identici su ogni loader
// perché toccano solo classi di Minecraft. Questo modulo non produce un jar
// distribuibile: il suo output viene incluso dentro quelli di neoforge/fabric.
neoForge {
    neoFormVersion = project.neoform_version
}

dependencies {
    // Annotazioni Mixin: in NeoForm puro non le fornisce nessuno, ma il codice
    // dei mixin va comunque compilato qui. A runtime le mette il loader.
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // @WrapOperation (Hook 3). Versione allineata a quella bundled in NeoForge
    // 21.1.232 (jarjar 0.5.3): NON alzarla senza ricontrollare il jarjar.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
}

// È QUESTO il modulo che V112 consuma: PitchBlackApi vive qui, ed è agnostica
// per loader e versione (non importa nemmeno una classe Minecraft). Coordinata
// stabile e senza versione MC dentro: net.saturnx:pitchblackdarkness:0.1.0
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${rootProject.projectDir}/repo"
        }
    }
}
